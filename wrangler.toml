name = "toctoc9"
main = "src/worker.js"
workers_dev = true
routes = [
  { pattern = "lueurvivante.fr/toctoc", zone_name = "lueurvivante.fr" },
  { pattern = "lueurvivante.fr/toctoc/", zone_name = "lueurvivante.fr" },
  # Jeu servi en premier plan : net.js, /toctoc/ws (WebSocket) et assets sous /toctoc/.
  { pattern = "lueurvivante.fr/toctoc*", zone_name = "lueurvivante.fr" }
]
compatibility_date = "2026-10-01"

[build]
command = "node build.mjs"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
